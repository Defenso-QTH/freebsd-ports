name: poudriere-libudev-devd

on:
  push:
    branches: [ 'ci-poudriere' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  poudriere:
    runs-on: ubuntu-24.04
    # poudriere in a nested FreeBSD VM is slow; meson pulls in python, which
    # is the long pole. Stay under the 6h hosted-runner hard limit.
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: check out the patched port only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            devel/libudev-devd
            x11/libinput
            sysutils/seatd
            x11-toolkits/wlroots019
            x11-toolkits/wlroots020
          sparse-checkout-cone-mode: false

      - name: restore poudriere cache
        uses: actions/cache@v4
        with:
          path: |
            poudriere-cache/packages
            poudriere-cache/distfiles
          key: poudriere-${{ runner.os }}-15.1-${{ hashFiles('devel/libudev-devd/**', 'x11/libinput/**', 'sysutils/seatd/**', 'x11-toolkits/wlroots019/**', 'x11-toolkits/wlroots020/**') }}
          restore-keys: |
            poudriere-${{ runner.os }}-15.1-

      - name: poudriere bulk build (FreeBSD VM)
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          mem: 6144
          cpu: 4
          copyback: true
          run: |
            set -eux
            export ASSUME_ALWAYS_YES=yes
            pkg install -y poudriere git

            # poudriere in directory mode (the VM image is not ZFS)
            { echo NO_ZFS=yes
              echo BASEFS=/poudriere
              echo DISTFILES_CACHE=/poudriere/distfiles
              echo RESOLV_CONF=/etc/resolv.conf
              echo ALLOW_MAKE_JOBS=yes
            } > /usr/local/etc/poudriere.conf
            mkdir -p /poudriere/data/packages /poudriere/distfiles

            # build seatd with a Defenso-specific compiled-in socket path
            # (sysutils/seatd reads SEATD_SOCKET -> meson -Ddefaultpath)
            mkdir -p /usr/local/etc/poudriere.d
            echo 'SEATD_SOCKET=/var/run/seatd/seatd.sock' \
                > /usr/local/etc/poudriere.d/make.conf

            # populate poudriere dirs from cache (no-op on first run)
            mkdir -p poudriere-cache/packages poudriere-cache/distfiles
            cp -a poudriere-cache/packages/. /poudriere/data/packages/ || true
            cp -a poudriere-cache/distfiles/. /poudriere/distfiles/ || true

            # full ports tree (shallow) with our patched port overlaid
            git clone --depth 1 https://github.com/freebsd/freebsd-ports.git /poudriere-ports
            rm -rf /poudriere-ports/devel/libudev-devd
            cp -a devel/libudev-devd /poudriere-ports/devel/libudev-devd
            # x11/libinput carries our jail patch (files/patch-src_evdev.c)
            rm -rf /poudriere-ports/x11/libinput
            cp -a x11/libinput /poudriere-ports/x11/libinput
            # sysutils/seatd: post-0.9.3 snapshot + SEATD_SOCKET knob
            rm -rf /poudriere-ports/sysutils/seatd
            cp -a sysutils/seatd /poudriere-ports/sysutils/seatd
            # x11-toolkits/wlroots019: jail render-node fallback
            rm -rf /poudriere-ports/x11-toolkits/wlroots019
            cp -a x11-toolkits/wlroots019 /poudriere-ports/x11-toolkits/wlroots019
            # x11-toolkits/wlroots020: jail render-node fallback
            rm -rf /poudriere-ports/x11-toolkits/wlroots020
            cp -a x11-toolkits/wlroots020 /poudriere-ports/x11-toolkits/wlroots020

            # refresh the checksum in case the pinned commit changed
            make -C /poudriere-ports/devel/libudev-devd makesum || true

            # build jail (downloads 15.1-RELEASE base) + register the ports tree
            poudriere jail -c -j j151 -v 15.1-RELEASE -a amd64
            poudriere ports -c -p local -m null -M /poudriere-ports

            # build the ports and their dependency closure
            printf 'devel/libudev-devd\nx11/libinput\nsysutils/seatd\nx11-toolkits/wlroots019\nx11-toolkits/wlroots020\n' > /tmp/pkglist
            poudriere bulk -j j151 -p local -f /tmp/pkglist

            # sync built packages and distfiles back to workspace for caching
            cp -a /poudriere/data/packages/. poudriere-cache/packages/ || true
            cp -a /poudriere/distfiles/. poudriere-cache/distfiles/ || true

            # export the pkg repo to the workspace, resolving poudriere's
            # symlinks (GitHub Pages won't follow them) so it serves as-is.
            rm -rf repo && mkdir -p repo
            SRC=/poudriere/data/packages/j151-local/.latest
            [ -e "$SRC" ] || SRC=/poudriere/data/packages/j151-local
            cp -RL "$SRC"/. repo/
            ls -lR repo | head -n 40

      - name: upload package repo (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pkg-repo
          path: repo
          retention-days: 7

      - name: merge drm-kmod packages into repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRMRUN=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow poudriere-drm-kmod.yml \
            --branch "${{ github.ref_name }}" \
            --status success --limit 1 \
            --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$DRMRUN" ]; then
            gh run download "$DRMRUN" \
              --repo "${{ github.repository }}" \
              --name pkg-repo-drm-kmod --dir drm-repo 2>/dev/null || true
            [ -d drm-repo ] && cp -rn drm-repo/. repo/ || true
          fi

      - name: upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
